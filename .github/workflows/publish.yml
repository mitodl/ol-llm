name: Publish ol-llm to PyPI

# Publishes when a merge to main changes the version in python/pyproject.toml.
# Uses PyPI Trusted Publishing: the `pypi` environment's OIDC token is the only
# credential, so there is no API token to store or rotate. Adapted from
# mitodl/agent-kit .github/workflows/publish-witan-core.yml.
#
# Three jobs so the one holding the OIDC token runs no project code: `build`
# installs, tests, and builds with read-only permissions; `publish` only uploads
# the artifacts; `tag` marks the commit once the upload succeeded.
on:
  push:
    branches: ["main"]
    paths:
      - "python/pyproject.toml"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: publish-ol-llm
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    # workflow_dispatch can run from any ref; only main may publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
    outputs:
      new: ${{ steps.check.outputs.new }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"

      - name: Read version
        id: version
        working-directory: python
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "tag=ol-llm-v$version" >> "$GITHUB_OUTPUT"

      - name: Check for a new version
        id: check
        # A change to pyproject.toml without a version bump (a dependency edit,
        # say) publishes nothing.
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing new to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.check.outputs.new == 'true'
        run: |
          uv sync --frozen
          uv run pytest python/tests

      - name: Build
        if: steps.check.outputs.new == 'true'
        run: uv build --package ol-llm -o dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.check.outputs.new == 'true'
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: needs.build.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # the OIDC token PyPI Trusted Publishing exchanges
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

  tag:
    name: Tag the release
    # Only after a successful publish, so a tag always means the version is on PyPI.
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # the push below needs the token

      - name: Tag the release
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
