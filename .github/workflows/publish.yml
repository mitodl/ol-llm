name: Publish ol-llm to PyPI

# Publishes when a merge to main changes the version in python/pyproject.toml.
# Uses PyPI Trusted Publishing: the `pypi` environment's OIDC token is the only
# credential, so there is no API token to store or rotate. Adapted from
# mitodl/agent-kit .github/workflows/publish-witan-core.yml.
on:
  push:
    branches: ["main"]
    paths:
      - "python/pyproject.toml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true # the tag step below pushes

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"

      - name: Read version
        id: version
        working-directory: python
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=ol-llm-v$version" >> "$GITHUB_OUTPUT"

      - name: Check for a new version
        id: check
        # A change to pyproject.toml without a version bump (a dependency edit,
        # say) publishes nothing.
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing new to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.check.outputs.new == 'true'
        run: |
          uv sync --frozen
          uv run pytest python/tests

      - name: Build
        if: steps.check.outputs.new == 'true'
        run: uv build --package ol-llm -o dist

      - name: Publish to PyPI
        if: steps.check.outputs.new == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

      - name: Tag the release
        # Only after a successful publish, so a tag always means the version is on PyPI.
        if: steps.check.outputs.new == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
