name: python

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the oldest Python among the edx-platform releases in use;
        # learn-ai and ol-data-platform run 3.14.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install
        run: uv sync --frozen
      - name: Type check
        run: uv run mypy python/src
      - name: Test
        run: uv run pytest python/tests

  newest-dependencies:
    # Consumers resolve their own versions, which run ahead of uv.lock. The
    # harness extra pins slim exactly and would hold it at the lock's version,
    # and the tests use neither it nor the memory extra.
    name: test (newest dependencies, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The ends of the test matrix's range.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python-version }}
      - name: Install the newest releases the extras allow
        run: |
          uv venv "$RUNNER_TEMP/newest"
          uv pip install --python "$RUNNER_TEMP/newest" \
            "./python[anthropic,bedrock,google,mistral,openai,pydantic-ai]" "pytest>=8.4"
          uv pip list --python "$RUNNER_TEMP/newest"
      - name: Test
        run: '"$RUNNER_TEMP/newest/bin/python" -m pytest python/tests'

  base-install:
    # The base package must work with no extras: PydanticAI and the memory and
    # harness clients are opt-in, and nothing in the base may import them.
    name: base install without extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"
          python-version: "3.14"
      - name: Install ol-llm alone
        run: |
          uv venv "$RUNNER_TEMP/base"
          uv pip install --python "$RUNNER_TEMP/base" ./python
      - name: Import without extras
        run: |
          "$RUNNER_TEMP/base/bin/python" - <<'PY'
          import importlib.util
          import ol_llm
          import opik
          absent = ["pydantic_ai", "pydantic_ai_harness", "hindsight_client"]
          present = [name for name in absent if importlib.util.find_spec(name)]
          assert not present, f"installed without being asked for: {present}"
          # Call sites not built on PydanticAI use the policy from the base.
          use_case = ol_llm.UseCase(
              app="ci", name="base", profile="batch", model="openai:gpt-4o-mini"
          )
          assert ol_llm.resolve_policy(use_case, {}).timeout_seconds == 300
          # The catalog ships in the wheel, and apps check against it without extras.
          assert ol_llm.check_model_ids(["openai:gpt-4o-mini"]).ok
          # So do the batch helpers.
          assert ol_llm.dagster_pool(use_case) == "llm/ci/base"
          # So does the embedding trace for clients the library does not build.
          ol_llm.configure(ol_llm.Settings(environment="ci"))
          ol_llm.configure_tracing(ol_llm.TracingConfig(enabled=False))
          search = ol_llm.UseCase(
              app="ci",
              name="search",
              profile="request",
              model="openai:text-embedding-3-small",
          )
          with ol_llm.traced_embedding(search, ["text"]) as request:
              request.record([[0.0, 1.0]], input_tokens=1)
          try:
              ol_llm.build_model
          except ImportError as exc:
              assert "ol-llm[pydantic-ai]" in str(exc), exc
          else:
              raise AssertionError("build_model imported without PydanticAI")
          print(f"ol-llm {ol_llm.__version__} imports with no extras")
          PY

  slim-smoke:
    # The overrides a uv consumer copies to drop opik's heavy dependencies. A
    # failure here means an opik release (or ol-llm itself) now needs a package
    # those overrides remove, and consumers would break at import time.
    name: slimmed install smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"
          python-version: "3.14"
      - name: Install
        run: uv sync --frozen
      - name: Smoke test
        run: uv run python smoke_test.py

  edx-platform-resolution:
    # The course-translation plugins install ol-llm into edxapp, whose
    # dependencies are pinned by edx-platform. Only master is checked: ulmo and
    # verawood cap openai<=0.28.1, which the openai extra cannot satisfy.
    name: resolves with edx-platform master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"
      - name: Fetch edx-platform master requirements
        run: |
          curl -fsSL -o "$RUNNER_TEMP/edx-base.txt" \
            https://raw.githubusercontent.com/openedx/edx-platform/master/requirements/edx/base.txt
      - name: Resolve ol-llm[openai] under edx-platform pins
        run: |
          echo "./python[openai]" | uv pip compile - \
            -c "$RUNNER_TEMP/edx-base.txt" \
            --python-version 3.12 \
            -o "$RUNNER_TEMP/resolved.txt"
