[project]
name = "ol-llm"
version = "0.0.4"
description = "Shared library for LLM calls at MIT Open Learning, with Opik tracing, prompt management, and evaluation built in"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "MIT Open Learning", email = "odl-devops@mit.edu" }]
requires-python = ">=3.11"
keywords = ["llm", "opik", "pydantic-ai", "observability"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
# The base install is what every call site needs whatever it is built on: the
# Opik SDK for prompts and the root trace, and OpenTelemetry for the spans a
# framework emits. Everything framework- or backend-specific is an extra.
#
# opik is pinned exactly: consumers slim it with uv override-dependencies, and a
# release that starts importing a dropped package eagerly would break them at
# import time. The smoke project in python/smoke/ catches that on every bump.
dependencies = [
    "httpx>=0.28",
    "opentelemetry-exporter-otlp-proto-http>=1.38",
    "opentelemetry-sdk>=1.38",
    "opik==2.2.94",
    # Validates the model catalog. opik requires it already. 2.14 makes rebuilding a
    # deferred model thread-safe (pydantic/pydantic#13438); the openai SDK defers
    # its response models, so batch workers' first concurrent responses failed to
    # parse before it.
    "pydantic>=2.14,<3",
    # The OTLP exporter takes a requests session, which is where the refreshing
    # Keycloak auth for span export attaches.
    "requests>=2.32",
]

[project.optional-dependencies]
# The default construction path for agents and single calls.
pydantic-ai = ["pydantic-ai-slim>=2.52,<3"]
# Provider SDKs, each through PydanticAI's own extra, so a provider extra also
# installs PydanticAI.
anthropic = ["pydantic-ai-slim[anthropic]>=2.52,<3"]
bedrock = ["pydantic-ai-slim[bedrock]>=2.52,<3"]
google = ["pydantic-ai-slim[google]>=2.52,<3"]
mistral = ["pydantic-ai-slim[mistral]>=2.52,<3"]
openai = ["pydantic-ai-slim[openai]>=2.52,<3"]
# PydanticAI's first-party capabilities: in-session memory, compaction, and
# conversation search. Each harness release pins pydantic-ai-slim exactly, so
# this extra also fixes the PydanticAI version. 0.x: pinned to a minor series.
harness = ["pydantic-ai-harness>=0.52,<0.53"]
# Client for the shared memory service (cross-session recall and user-scoped
# facts). Hindsight is the leading candidate and its PoC is still open, so this
# extra may change backend before the memory interface ships.
memory = ["hindsight-client>=0.10,<0.11"]

[project.scripts]
ol-llm-catalog = "ol_llm.catalog:main"
ol-llm-eval = "ol_llm.evaluation:main"

[project.urls]
Homepage = "https://github.com/mitodl/ol-llm"
Repository = "https://github.com/mitodl/ol-llm"
Issues = "https://github.com/mitodl/ol-llm/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ol_llm"]
