# The model catalog: the status and price of the models Open Learning
# applications call.
#
# It is not an allowlist. build_model builds an id missing from here, with a warning
# and a model_status:uncataloged trace tag, and refuses a retired one. Apps check
# their own model lists against it in CI. Policy: mitodl/ol-infrastructure
# docs/plans/llm-usage-policies-spec.md §2.2. Adding or changing an entry is a pull
# request approved by the catalog owner (Platform Engineering); a model in use
# without an entry has no price in the spend rules until it gets one.
#
# Fields, with defaults in brackets:
#   id                  PydanticAI form, provider:model. Bedrock ids are inference
#                       profile ids; Azure ids name the deployment, which is
#                       deployed under the model's own name.
#   kind                chat or embedding.
#   status              [allowed] allowed, deprecated (needs retires_on), or
#                       retired. A deprecated id builds and tags the trace
#                       model_status:deprecated; a retired id raises.
#   retires_on          the date the provider retires the model, or the date we
#                       stop allowing it.
#   floating            [false] true when the id can change behavior without
#                       changing: an alias the provider repoints (gpt-4o,
#                       mistral-large-latest, an Azure deployment left on
#                       auto-upgrade) or a preview.
#   route               [direct] direct, or gateway when the app reaches it through
#                       an LLM gateway route.
#   route_falls_back    [false] the gateway route falls back to another model on
#                       its own, so a use case on it may not declare
#                       fallback_models.
#   opik_provider,      the provider and model name Opik's price table holds the
#   opik_model          model under. Both absent when Opik has no price for it,
#                       and its traces then carry no cost.
#   input_usd_per_mtok, list price in US dollars per million tokens, at the lowest
#   output_usd_per_mtok tier where the price is tiered by prompt length. The
#                       Prometheus spend rules use these.
#
# Sources for the initial entries are in llm-usage-policies-spec.md §2.1.
# Prices were read from Opik 2.2.87's price table where it has the model.

# OpenAI direct.

[[model]]
id = "openai:gpt-4o-mini"
kind = "chat"
floating = true
opik_provider = "openai"
opik_model = "gpt-4o-mini"
input_usd_per_mtok = "0.15"
output_usd_per_mtok = "0.60"

