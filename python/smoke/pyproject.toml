# A consumer-shaped project: ol-llm installed with the overrides a uv consumer
# copies to drop the opik SDK's heavy dependencies. CI runs smoke_test.py in this
# environment on every change, so an opik release that starts importing a dropped
# package eagerly fails here before any app picks it up.
[project]
name = "ol-llm-smoke"
version = "0"
requires-python = ">=3.11"
# The pydantic-ai extra, because the smoke test runs an instrumented agent.
dependencies = ["ol-llm[pydantic-ai]"]

[tool.uv]
package = false
# Not consumer guidance. litellm (and filelock, reachable only through it) is
# overridden away below, but the lock still records both and advisory scanners
# read the lock, so it keeps the root's floors.
constraint-dependencies = ["filelock>=4.2.1", "litellm>=1.95.0"]
override-dependencies = [
    # The README's cap overrides for opik 2.2.143, for the packages the slimming
    # entries below do not drop.
    "httpx[http2]>=0.28.1,<1",
    "jinja2>=3.1.6,<4",
    "orjson>=3.9.14; platform_python_implementation == 'CPython' and platform_machine in 'x86_64 AMD64 aarch64 arm64 ARM64 i686 x86' and (sys_platform != 'win32' or platform_machine != 'ARM64' or python_version >= '3.11')",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.14.1,<3",
    "rich",
    "sentry-sdk>=2.0.0",
    "tenacity>=8.2.3,!=8.4.0,<9.2.0",
    "tqdm>=4.42.1",
    "uuid6",
    # The README's slimming overrides.
    "boto3-stubs; sys_platform == 'never'",
    "click; sys_platform == 'never'",
    "litellm; sys_platform == 'never'",
    "openai; sys_platform == 'never'",
    "pytest; sys_platform == 'never'",
    "rapidfuzz; sys_platform == 'never'",
    "tree-sitter; sys_platform == 'never'",
    "tree-sitter-javascript; sys_platform == 'never'",
    "tree-sitter-typescript; sys_platform == 'never'",
    "watchfiles; sys_platform == 'never'",
]

[tool.uv.sources]
ol-llm = { path = "..", editable = true }
