# A consumer-shaped project: ol-llm installed with the overrides a uv consumer
# copies to drop the opik SDK's heavy dependencies. CI runs smoke_test.py in this
# environment on every change, so an opik release that starts importing a dropped
# package eagerly fails here before any app picks it up.
[project]
name = "ol-llm-smoke"
version = "0"
requires-python = ">=3.11"
# The pydantic-ai extra, because the smoke test runs an instrumented agent.
dependencies = ["ol-llm[pydantic-ai]"]

[tool.uv]
constraint-dependencies = ["certifi>=2026.10.19"]  # eMudhra CA compromise: never resolve a certifi that trusts the compromised CAs
package = false
override-dependencies = [
    "boto3-stubs; sys_platform == 'never'",
    "click; sys_platform == 'never'",
    "litellm; sys_platform == 'never'",
    "openai; sys_platform == 'never'",
    "pytest; sys_platform == 'never'",
    "rapidfuzz; sys_platform == 'never'",
    "tree-sitter; sys_platform == 'never'",
    "tree-sitter-javascript; sys_platform == 'never'",
    "tree-sitter-typescript; sys_platform == 'never'",
    "watchfiles; sys_platform == 'never'",
]

[tool.uv.sources]
ol-llm = { path = "..", editable = true }
