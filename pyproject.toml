[project]
name = "ol-llm-workspace"
version = "0"
description = "Workspace root for ol-llm. Not published; the distribution lives in python/."
requires-python = ">=3.11"

[dependency-groups]
prek = ["prek==0.5.10"]
dev = [
    { include-group = "prek" },
    "asgiref>=3.8",
    "mypy>=1.18",
    "ol-llm[anthropic,bedrock,google,harness,langchain,memory,mistral,openai,pydantic-ai]",
    "pytest>=8.4",
    "ruff>=0.15",
    "scriv>=1.8",
    "types-pyyaml>=6",
]

[tool.uv]
required-version = ">=0.12.22,<0.14"
package = false
# Floors for transitive dependencies with advisories against earlier releases, so a
# relock can't resolve back into them. They shape this lockfile only, not the wheel.
constraint-dependencies = [
    "filelock>=4.2.1",  # GHSA-v4x8-3wr5-3wq8; litellm up to 1.108.2 requires filelock<4
    "pyasn1>=0.6.5",    # GHSA-fm9c-5rcf-2q5p and three others; via google-auth
]
# opik requires litellm<1.106, and every litellm from 1.95.0 (GHSA-g5ff-637f-6q2m
# and earlier) to that bound requires openai<3, which the openai extra's openai 3
# excludes. This is the README's litellm override, which replaces opik's bound. It
# applies to this lockfile and to the CI jobs that run `uv pip` from this directory,
# so they test the litellm the README tells uv consumers to install.
override-dependencies = ["litellm>=1.108.3,<2"]

[tool.uv.workspace]
members = ["python"]
# The slimmed-install smoke project has its own lockfile on purpose: its
# override-dependencies are what a consumer would write, and they must not leak
# into the workspace that the main test matrix resolves.
exclude = ["python/smoke"]

[tool.uv.sources]
ol-llm = { workspace = true }

[tool.scriv]
# Run from the repository root: `uv run scriv create` adds a fragment to
# changelog.d/, and the release runs `uv run scriv collect`.
format = "md"
md_header_level = "2"
entry_title_template = "[{{ version }}] - {{ date.strftime('%Y-%m-%d') }}"
version = "literal: python/pyproject.toml: project.version"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "CPY",    # no per-file copyright headers; the license is in LICENSE
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "ISC001", # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
# The error names are the contract's (spec §3.2 rule 5), shared with other languages.
"python/src/ol_llm/errors.py" = ["N818"]
"python/src/ol_llm/memory/errors.py" = ["N818"]
"**/tests/**" = ["D", "INP001", "PLR2004", "S101", "S106"]
"python/smoke/smoke_test.py" = ["T201", "INP001"]

[tool.pytest.ini_options]
markers = [
    "network: fetches from the internet; deselect offline with -m 'not network'",
    "hindsight: writes to and forgets from a live Hindsight; skipped unless OL_LLM_MEMORY_IT_CONFIG is set",
]

[tool.mypy]
strict = true
python_version = "3.11"
